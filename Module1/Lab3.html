<!DOCTYPE html>
<html>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6.26.0/babel.js"></script>

<body>
	<div id="my-react-app">

	</div>
	<script type="text/javascript">
		console.info("This is a test log message.");
		const rootElTemp = document.getElementById('my-react-app');
		const rootTemp = ReactDOM.createRoot(rootElTemp);
		// Error
		const elementTemp = (<h1>Welcome to the world of React!</h1>);
		rootTemp.render(elementTemp);
	</script>
	<script type="text/babel">
		const rootEl = document.getElementById('my-react-app');
		const root = ReactDOM.createRoot(rootEl);
		// No Error
		const element = (<h1>Welcome to the world of React!</h1>);
		root.render(element);
	</script>
</body>

</html>
