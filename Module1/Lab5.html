<!DOCTYPE html>
<html>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6.26.0/babel.js"></script>

<body>
	<div id="my-react-app"></div>
	<script type="text/babel">
		const rootEl = document.getElementById('my-react-app');
		const root = ReactDOM.createRoot(rootEl);
		const fruit_orange = "Orange";
		const fruit_apple = "Apple";
		const fruit_banana = "Banana";
		const fruitsList= (
			<div>
				<div key="el-key" className="my-fruit">Some of my favorite fruits</div>
				<ul>
					<li key="O-key">{fruit_orange}</li>
					<li key="A-key">{fruit_apple}</li>
					<li key="B-key">{fruit_banana}</li>
				</ul>
			</div>
		);
		root.render(fruitsList);
	</script>
</body>

</html>
